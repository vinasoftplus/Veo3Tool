<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 500px;
      height: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      box-sizing: border-box;
    }
    
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    
    .header h1 {
      color: #1e293b;
      font-size: 18px;
      margin: 0 0 4px 0;
    }
    
    .header p {
      color: #6b7280;
      font-size: 14px;
      margin: 0;
    }
    
    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .button-container {
      margin-bottom: 12px;
      text-align: center;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: #3b82f6;
      color: white;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    
    button:hover {
      background: #2563eb;
    }
    
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    
    .textarea-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    textarea {
      width: 100%;
      height: 110px;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      resize: none;
      box-sizing: border-box;
      background: white;
      line-height: 1.4;
    }
    
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .status {
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 14px;
      text-align: center;
    }
    
    .status.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    
    .status.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    
    .hidden {
      display: none;
    }
    
    .info {
      font-size: 12px;
      color: #6b7280;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🍪 Google Cookie Extractor</h1>
  </div>
  
  
  
  <div class="section">
    <div class="section-title">Google Cookies</div>
    <div class="button-container">
      <button id="loadBtn">Load Google Cookies</button>
      <button id="copyBtn">Copy Google Cookies</button>
    </div>
    
    <div class="textarea-container">
      <textarea id="cookiesTextarea" readonly></textarea>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Grok Cookies</div>
    <div class="button-container">
      <button id="loadGrokBtn">Load Grok Cookies</button>
      <button id="copyGrokBtn">Copy Grok Cookies</button>
    </div>
    
    <div class="textarea-container">
      <textarea id="grokCookiesTextarea" readonly></textarea>
    </div>
  </div>
  

  <script src="popup.js"></script>
</body>
</html>
